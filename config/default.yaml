# Everything tunable lives here. Profiles in config/profiles/ override single keys.
server:
  host: 127.0.0.1
  port: 8700
  serve_ui: true          # serve frontend/dist from the API when it has been built
  ui_dir: frontend/dist
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:3000", "http://127.0.0.1:3000"]
workspace:
  root: workspaces
  default: own-campus
  schema_version: "1"
uploads:
  max_bytes: 4294967296
  extensions: [".mp4", ".mov", ".mkv", ".avi", ".m4v"]
  native_codecs: [h264, hevc, vp8, vp9, av1]   # anything else is converted to H.264 on upload
  transcode_timeout_s: 1800
llm:
  models:
    planner: openai/gpt-oss-20b
    hard: openai/gpt-oss-120b
    vision: qwen/qwen3.8-27b
    voice: whisper-large-v3-turbo
  onprem: false
memory:
  tau_hi: 0.92          # calibrated by M3 on 68 labelled pairs with the real bge-small: 0.85 let 5 wrong pairs through
  tau_lo: 0.62
  margin: 0.03          # two facts this close above tau_hi make the referent ambiguous
  alias_embed: true     # false = exact aliases only (ablation C4)
media:
  pre_roll_s: 3
  post_roll_s: 3
  blur_faces: true
  cache_max_bytes: 2147483648   # clips and thumbnails; oldest are removed first
  prerender_top: 3
  clip_max_width: 1280   # evidence clips: every frame of a blurred clip is face-checked, so size and rate set its speed
  clip_max_fps: 15
privacy:
  allow_hosts: []     # hosts reachable in on-prem mode besides loopback (empty = loopback only)
live:
  mediamtx_path: null   # null = look on PATH and in the winget folder
  rtsp_port: 8554
  max_streams: 16
  default_speed: 1.0
  max_tiles: 8          # simultaneous live tiles (each is one decoder)
  record: true          # keep a rolling recording of real RTSP cameras while they are analysed (evidence needs it)
  record_segment_s: 10
  record_minutes: 30    # how far back evidence can be cut
  record_max_gb: 2      # disk cap for each camera's buffer
doctor:
  min_free_gb: 20
up:
  start_ollama: false    # on-prem mode always starts Ollama if it is installed but not running
alerts:
  default_cooldown_s: 30
  push_cap:             # phone pushes per watch; the alerts themselves are always stored and shown
    count: 5            # 0 = no cap
    window_s: 60
jobs:
  workers: 0            # 0 = auto (cpu cores / 4, at least 1)
  default_layers: [L0, L1, L2]
  retry_failed_on_start: true   # cameras that stopped with an error are indexed again when the app starts
  deferred_layers: [L3]  # captions run after every camera is searchable, never beside the indexing
  stub_tick_s: 0.05     # used only while the perception pipeline is not installed
ingest:                 # perception pipeline (M2); keys and defaults mirror backend/evora/perception/settings.py
  motion_gate: true     # false = fixed sampling rate (ablation C6)
  fps_floor: 1.0
  fps_ceil: 8.0
  fixed_fps: 4.0
  motion_proxy_px: 160
  motion_pixel_delta: 18
  motion_active_frac: 0.02
  max_width: 1280
  scene_every_s: 2.0
  scene_jpeg_width: 640
  detector: yolo26n.pt
  det_conf: 0.25
  det_imgsz: 0          # 0 = automatic: the frame width rounded to 32, at most det_imgsz_max (1280). A fixed 640 shrank
                        # 1080p people to about 18 px and missed most of them; the cpu profile keeps 640 for speed
  tracker: bytetrack.yaml
  track_lost_s: 5.0
  min_track_obs: 3
  crop_k: 4
  crop_pad: 0.08
  crop_jpeg_quality: 88
  crop_max_side: 256
  point_hz: 4.0
  image_model: google/siglip2-base-patch16-224
  embed_batch: 32
query:
  honest_actions: true   # actions with no recogniser (put down, get out of a car...) are answered with who was there
retrieval:              # query side (M3); keys and defaults mirror backend/evora/query/retrieve.py
  unit: track           # track | frame (ablation C1)
  attributes: true      # ablation C2
  expansion: "off"      # off | lexicon | llm
  weights: {image: 0.55, attributes: 0.25, caption: 0.10, scene: 0.10}
  calibration: {midpoint: 0.09, scale: 0.015}   # fitted on real SigLIP2 cosines, see PROGRESS
  ann_k: 400
  scene_k: 300
  pool_limit: 100
