# Everything tunable lives here. Profiles in config/profiles/ override single keys.
server:
  host: 127.0.0.1
  port: 8700
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]
workspace:
  root: workspaces
  default: own-campus
  schema_version: "1"
uploads:
  max_bytes: 4294967296
  extensions: [".mp4", ".mov", ".mkv", ".avi", ".m4v"]
  native_codecs: [h264, hevc, vp8, vp9, av1]   # anything else is converted to H.264 on upload
  transcode_timeout_s: 1800
llm:
  models:
    planner: openai/gpt-oss-20b
    hard: openai/gpt-oss-120b
    vision: qwen/qwen3.8-27b
    voice: whisper-large-v3-turbo
  onprem: false
memory:
  tau_hi: 0.85
  tau_lo: 0.60
  margin: 0.03          # two facts this close above tau_hi make the referent ambiguous
  alias_embed: true     # false = exact aliases only (ablation C4)
media:
  pre_roll_s: 3
  post_roll_s: 3
  blur_faces: true
  cache_max_bytes: 2147483648   # clips and thumbnails; oldest are removed first
  prerender_top: 3
alerts:
  default_cooldown_s: 30
jobs:
  workers: 0            # 0 = auto (cpu cores / 4, at least 1)
  default_layers: [L0, L1, L2, L3]
  stub_tick_s: 0.05     # used only while the perception pipeline is not installed
