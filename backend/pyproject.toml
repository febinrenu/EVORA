[project]
name = "evora"
version = "0.1.0"
description = "Multi-camera video intelligence with conversational queries"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "lancedb>=0.13",
  "httpx>=0.27",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "av>=12",
  "tzdata",
  "scipy>=1.11",
  "cryptography>=42",
]

[project.optional-dependencies]
embed = ["fastembed>=0.4"]
perception = [
  "torch>=2.3",
  "torchvision>=0.18",
  "ultralytics>=8.3",
  "transformers>=4.45",
  "clip @ git+https://github.com/ultralytics/CLIP.git",
  "boxmot>=10",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyPI only has CPU builds of torch for Windows, so a Windows setup silently ran everything on the processor even on a
# laptop with an NVIDIA GPU. On Windows torch and torchvision come from PyTorch's CUDA 12.6 index instead (these builds
# also run on machines without a GPU); Linux keeps PyPI, whose torch already includes CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["evora"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Query"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S110", "E722"]
ignore = ["E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"
markers = ["real_perception: use the real perception functions instead of treating them as absent"]
